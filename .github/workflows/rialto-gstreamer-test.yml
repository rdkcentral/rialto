#Fix test on test

name: Rialto GStreamer Test

on:
  pull_request:
    branches: ["master", "release/*"]

permissions:
  contents: read

jobs:
  select_dependency_ref:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.select.outputs.ref }}

    steps:
      - name: Find matching rialto-gstreamer branch
        id: select
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          repo="https://github.com/rdkcentral/rialto-gstreamer.git"
          for candidate in "$PR_BRANCH" "$BASE_BRANCH"; do
            if [ -n "$candidate" ] && git ls-remote --exit-code --heads "$repo" "refs/heads/$candidate" > /dev/null; then
              echo "Using rialto-gstreamer branch: $candidate"
              echo "ref=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No matching dependency branch; release-pin fallback will run instead"
          echo "ref=" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: select_dependency_ref
    if: needs.select_dependency_ref.outputs.ref != ''
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout rialto-gstreamer repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: rdkcentral/rialto-gstreamer
          ref: ${{ needs.select_dependency_ref.outputs.ref }}
          path: rialto-gstreamer
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies and build GStreamer library
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      - name: Run tests
        env:
          RIALTO_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cd rialto-gstreamer
          python build_ut.py -c -xml -f -b "$RIALTO_BUILD_BRANCH"
        
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            rialto-gstreamer/gtest_result.log
            rialto-gstreamer/build/*gtest_result.xml

  build-and-test-release-pins:
    needs: select_dependency_ref
    if: needs.select_dependency_ref.outputs.ref == ''
    runs-on: ubuntu-24.04

    steps:
      - name: Select release pin for target branch
        id: select-release
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$TARGET_BRANCH" in
            master)
              release_line=master
              manifest_repository=meta-rdk-video
              manifest_ref=main
              manifest_file=recipes-extended/rialto/rialto_revision.inc
              gstreamer_key=RIALTO_GSTREAMER_SRCREV
              ;;
            release/v0.15.*|support/8.4.*)
              release_line=8.4
              manifest_repository=meta-middleware-generic-support
              manifest_ref=support/8.4.4.0
              manifest_file=conf/include/generic-srcrev.inc
              gstreamer_key='SRCREV:pn-rialto-gstreamer'
              ;;
            release/v0.22.*|support/8.6.*)
              release_line=8.6
              manifest_repository=meta-rdk-video
              manifest_ref=support/8.6.3.0
              manifest_file=recipes-extended/rialto/rialto_revision.inc
              gstreamer_key=RIALTO_GSTREAMER_SRCREV
              ;;
            *)
              echo "No dependency pin mapping for target branch: $TARGET_BRANCH" >&2
              exit 1
              ;;
          esac
          {
            echo "release_line=$release_line"
            echo "manifest_repository=$manifest_repository"
            echo "manifest_ref=$manifest_ref"
            echo "manifest_file=$manifest_file"
            echo "gstreamer_key=$gstreamer_key"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ steps.select-release.outputs.release_line }} platform manifest
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: rdkcentral/${{ steps.select-release.outputs.manifest_repository }}
          ref: ${{ steps.select-release.outputs.manifest_ref }}
          path: platform-manifest

      - name: Resolve GStreamer SRCREV from platform manifest
        id: resolve-pins
        env:
          MANIFEST_FILE: platform-manifest/${{ steps.select-release.outputs.manifest_file }}
          GSTREAMER_KEY: ${{ steps.select-release.outputs.gstreamer_key }}
        run: |
          set -eu
          gstreamer_ref=$(awk -F'"' -v key="$GSTREAMER_KEY" 'index($0, key) { print $2; exit }' "$MANIFEST_FILE")
          if ! printf '%s\n' "$gstreamer_ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve a 40-character GStreamer SRCREV from $MANIFEST_FILE ($GSTREAMER_KEY)" >&2
            exit 1
          fi
          echo "Using manifest GStreamer SRCREV: $gstreamer_ref"
          echo "gstreamer_ref=$gstreamer_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout rialto-gstreamer ${{ steps.select-release.outputs.release_line }} pin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: rdkcentral/rialto-gstreamer
          ref: ${{ steps.resolve-pins.outputs.gstreamer_ref }}
          path: rialto-gstreamer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies and build GStreamer library
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      - name: Run tests against Rialto PR branch
        env:
          RIALTO_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cd rialto-gstreamer
          python build_ut.py -c -xml -f -b "$RIALTO_BUILD_BRANCH"

      - name: Upload release-pin logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gstreamer-${{ steps.select-release.outputs.release_line }}-logs
          path: |
            rialto-gstreamer/gtest_result.log
            rialto-gstreamer/build/*gtest_result.xml
           