name: Rialto GStreamer Test

on:
  pull_request:
    branches: ["master", "release/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select_dependency_ref:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.select.outputs.ref }}

    steps:
      - name: Find matching rialto-gstreamer branch
        id: select
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          repo="https://github.com/rdkcentral/rialto-gstreamer.git"
          for candidate in "$PR_BRANCH" "$BASE_BRANCH"; do
            [ -n "$candidate" ] || continue
            if git ls-remote --exit-code --heads "$repo" "refs/heads/$candidate" > /dev/null; then
              echo "Using rialto-gstreamer branch: $candidate"
              echo "ref=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            else
              status=$?
              if [ "$status" -ne 2 ]; then
                echo "Could not query dependency branch: $candidate" >&2
                exit "$status"
              fi
            fi
          done
          echo "No matching dependency branch; release-pin fallback will run instead"
          echo "ref=" >> "$GITHUB_OUTPUT"

  build-and-test-branch:
    needs: select_dependency_ref
    if: github.event_name == 'pull_request' && needs.select_dependency_ref.outputs.ref != ''
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout rialto-gstreamer repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: rdkcentral/rialto-gstreamer
          ref: ${{ needs.select_dependency_ref.outputs.ref }}
          path: rialto-gstreamer

      - name: Checkout Rialto headers under test
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: rialto-under-test
          persist-credentials: false
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies and build GStreamer library
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      - name: Run tests
        run: |
          mkdir -p rialto-gstreamer/tests/third-party/include
          cp -R rialto-under-test/media/public/include/. rialto-gstreamer/tests/third-party/include/
          if [ -d rialto-under-test/common/public/include ]; then
            cp -R rialto-under-test/common/public/include/. rialto-gstreamer/tests/third-party/include/
          fi
          cd rialto-gstreamer
          python build_ut.py -xml -f -b "${{ github.event.pull_request.head.sha || github.sha }}"
        
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            rialto-gstreamer/gtest_result.log
            rialto-gstreamer/build/*gtest_result.xml

  build-and-test:
    if: ${{ always() }}
    needs: [select_dependency_ref, build-and-test-branch, build-and-test-release-pins, build-and-test-manual]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected dependency tests to pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          MANUAL_RESULT: ${{ needs.build-and-test-manual.result }}
          SELECT_RESULT: ${{ needs.select_dependency_ref.result }}
          SELECTED_REF: ${{ needs.select_dependency_ref.outputs.ref }}
          BRANCH_RESULT: ${{ needs.build-and-test-branch.result }}
          PIN_RESULT: ${{ needs.build-and-test-release-pins.result }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$RUN_REF" != refs/heads/master ]; then
              echo "Manual adapter tests must be dispatched from master" >&2
              exit 1
            fi
            if [ "$MANUAL_RESULT" != success ]; then
              echo "Trusted manual adapter tests did not succeed: $MANUAL_RESULT" >&2
              exit 1
            fi
            exit 0
          fi
          if [ "$SELECT_RESULT" != success ]; then
            echo "Dependency selection did not succeed" >&2
            exit 1
          fi
          result="$PIN_RESULT"
          if [ -n "$SELECTED_REF" ]; then
            result="$BRANCH_RESULT"
          fi
          if [ "$result" != success ]; then
            echo "Selected dependency tests did not succeed: $result" >&2
            exit 1
          fi

  build-and-test-release-pins:
    needs: select_dependency_ref
    if: github.event_name == 'pull_request' && needs.select_dependency_ref.outputs.ref == ''
    runs-on: ubuntu-24.04

    steps:
      - name: Select release pin for target branch
        id: select-release
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$TARGET_BRANCH" in
            master)
              release_line=master
              manifest_repository=meta-rdk-video
              manifest_ref=main
              manifest_file=recipes-extended/rialto/rialto_revision.inc
              gstreamer_key=RIALTO_GSTREAMER_SRCREV
              ;;
            release/v0.15.*|support/v0.18.*|support/8.4.*)
              release_line=8.4
              manifest_repository=meta-middleware-generic-support
              manifest_ref=support/8.4.4.0
              manifest_file=conf/include/generic-srcrev.inc
              gstreamer_key='SRCREV:pn-rialto-gstreamer'
              ;;
            release/v0.22.*|support/8.6.*)
              release_line=8.6
              manifest_repository=meta-rdk-video
              manifest_ref=support/8.6.3.0
              manifest_file=recipes-extended/rialto/rialto_revision.inc
              gstreamer_key=RIALTO_GSTREAMER_SRCREV
              ;;
            *)
              echo "No dependency pin mapping for target branch: $TARGET_BRANCH" >&2
              exit 1
              ;;
          esac
          {
            echo "release_line=$release_line"
            echo "manifest_repository=$manifest_repository"
            echo "manifest_ref=$manifest_ref"
            echo "manifest_file=$manifest_file"
            echo "gstreamer_key=$gstreamer_key"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ steps.select-release.outputs.release_line }} platform manifest
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: rdkcentral/${{ steps.select-release.outputs.manifest_repository }}
          ref: ${{ steps.select-release.outputs.manifest_ref }}
          path: platform-manifest

      - name: Resolve GStreamer SRCREV from platform manifest
        id: resolve-pins
        env:
          MANIFEST_FILE: platform-manifest/${{ steps.select-release.outputs.manifest_file }}
          GSTREAMER_KEY: ${{ steps.select-release.outputs.gstreamer_key }}
        run: |
          set -eu
          gstreamer_ref=$(awk -F'"' -v key="$GSTREAMER_KEY" 'index($0, key) { print $2; exit }' "$MANIFEST_FILE")
          if ! printf '%s\n' "$gstreamer_ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve a 40-character GStreamer SRCREV from $MANIFEST_FILE ($GSTREAMER_KEY)" >&2
            exit 1
          fi
          echo "Using manifest GStreamer SRCREV: $gstreamer_ref"
          echo "gstreamer_ref=$gstreamer_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout rialto-gstreamer ${{ steps.select-release.outputs.release_line }} pin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: rdkcentral/rialto-gstreamer
          ref: ${{ steps.resolve-pins.outputs.gstreamer_ref }}
          path: rialto-gstreamer

      - name: Checkout Rialto headers under test
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: rialto-under-test
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies and build GStreamer library
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      - name: Run tests against Rialto PR branch
        run: |
          mkdir -p rialto-gstreamer/tests/third-party/include
          cp -R rialto-under-test/media/public/include/. rialto-gstreamer/tests/third-party/include/
          if [ -d rialto-under-test/common/public/include ]; then
            cp -R rialto-under-test/common/public/include/. rialto-gstreamer/tests/third-party/include/
          fi
          cd rialto-gstreamer
          python build_ut.py -xml -f -b "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload release-pin logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gstreamer-${{ steps.select-release.outputs.release_line }}-logs
          path: |
            rialto-gstreamer/gtest_result.log
            rialto-gstreamer/build/*gtest_result.xml

  build-and-test-manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed GStreamer Master revision
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/rialto-gstreamer
          ref: e4325dd947928542017b820c29b3dcf9bc80edef
          path: rialto-gstreamer
          persist-credentials: false

      - name: Checkout fixed OCDM metadata revision
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/rialto-ocdm
          ref: 990e56634478bcb3d86c4e5ef18e66ce787f1245
          path: rialto-ocdm-metadata
          persist-credentials: false

      - name: Checkout dispatched Rialto Master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rialto-under-test
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install GStreamer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      - name: Run fixed-revision tests against Rialto Master
        env:
          RIALTO_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p rialto-gstreamer/tests/third-party/include
          cp -R rialto-under-test/media/public/include/. rialto-gstreamer/tests/third-party/include/
          cp -R rialto-under-test/common/public/include/. rialto-gstreamer/tests/third-party/include/
          cp rialto-ocdm-metadata/library/include/RialtoGStreamerEMEProtectionMetadata.h rialto-gstreamer/tests/third-party/include/
          cp rialto-ocdm-metadata/library/source/RialtoGStreamerEMEProtectionMetadata.cpp rialto-gstreamer/tests/third-party/source/
          cd rialto-gstreamer
          python build_ut.py -xml -f -b "$RIALTO_COMMIT"

      - name: Upload manual build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gstreamer-manual-logs
          path: |
            rialto-gstreamer/gtest_result.log
            rialto-gstreamer/build/*gtest_result.xml
           