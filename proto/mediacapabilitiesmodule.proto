syntax = "proto2";

import "rialtocommon.proto";
import "mediaCapabilitiesCommon.proto";

package firebolt.rialto;

// You need this to generate the rpc service stubs
option cc_generic_services = true;

/**
 * @fn AudioDecoderCapabilities getSupportedAudioCapabilities()
 * @brief Gets the supported audio capabilities.
 *
 * @returns    audio_decoder_capabilities The supported audio capabilities.
 */
message GetAudioCapabilitiesRequest {
}
message GetAudioCapabilitiesResponse {
  optional AudioCapabilities audio_capabilities = 1;
}

/**
 * @fn VideoDecoderCapabilities getSupportedVideoCapabilities()
 * @brief Gets the supported video capabilities.
 *
 * @returns    video_decoder_capabilities The supported video capabilities.
 */
message GetVideoCapabilitiesRequest {
}
message GetVideoCapabilitiesResponse {
  optional VideoCapabilities video_capabilities = 1;
}

service MediaCapabilities {
    /**
     * @brief Gets the supported audio capabilities.
     * @see GetAudioCapabilitiesRequest
     */
    rpc getSupportedAudioCapabilities(GetAudioCapabilitiesRequest) returns (GetAudioCapabilitiesResponse) {
    }

    /**
     * @brief Gets the supported video capabilities.
     * @see GetVideoCapabilitiesRequest
     */
    rpc getSupportedVideoCapabilities(GetVideoCapabilitiesRequest) returns (GetVideoCapabilitiesResponse) {
    }
}
