syntax = "proto2";

import "mediaCapabilitiesCommon.proto";

package firebolt.rialto;

// You need this to generate the rpc service stubs
option cc_generic_services = true;

/**
 * @fn AudioDecoderCapabilities getSupportedAudioCapabilities()
 * @brief Gets the supported audio capabilities. Response reuses the shared
 *        AudioCapabilities message from mediaCapabilitiesCommon.proto so the
 *        structure is defined in exactly one place.
 */
message GetSupportedAudioCapabilitiesRequest {
}

/**
 * @fn VideoDecoderCapabilities getSupportedVideoCapabilities()
 * @brief Gets the supported video capabilities. Response reuses the shared
 *        VideoCapabilities message from mediaCapabilitiesCommon.proto so the
 *        structure is defined in exactly one place.
 */
message GetSupportedVideoCapabilitiesRequest {
}

service MediaCapabilitiesModule {
    /**
     * @brief Gets the supported audio capabilities.
     * @see GetSupportedAudioCapabilitiesRequest
     */
    rpc getSupportedAudioCapabilities(GetSupportedAudioCapabilitiesRequest) returns (AudioCapabilities) {
    }

    /**
     * @brief Gets the supported video capabilities.
     * @see GetSupportedVideoCapabilitiesRequest
     */
    rpc getSupportedVideoCapabilities(GetSupportedVideoCapabilitiesRequest) returns (VideoCapabilities) {
    }
}
