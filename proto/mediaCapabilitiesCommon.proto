syntax = "proto2";

package firebolt.rialto;

/**
 * @brief Shared audio decoder capabilities structure.
 *        Used by both servermanagermodule and media capabilities queries.
 */
message AudioCapabilities {
  message AudioProfileCapability {
    optional uint64 max_bitrate_in_bps    = 1;
    optional uint32 max_channels          = 2;
    optional uint32 max_sample_rate_in_hz = 3;
    optional uint32 max_bit_depth         = 4;
  }
  enum AacProfile       { AAC_PROFILE_LC = 0; AAC_PROFILE_HE_V1 = 1; AAC_PROFILE_HE_V2 = 2; AAC_PROFILE_ELD = 3; AAC_PROFILE_X_HE = 4; }
  enum DolbyAc3Profile  { DOLBY_AC3_PROFILE_STANDARD = 0; }
  enum DolbyEac3Profile { DOLBY_EAC3_PROFILE_PLUS = 0; DOLBY_EAC3_PROFILE_PLUS_JOC = 1; }
  enum MpegAudioProfile { MPEG_AUDIO_PROFILE_LAYER_1 = 0; MPEG_AUDIO_PROFILE_LAYER_2 = 1; }
  enum RealAudioProfile { REALAUDIO_PROFILE_RA8 = 0; REALAUDIO_PROFILE_RA10 = 1; }
  enum UsacProfile      { USAC_PROFILE_BASELINE = 0; USAC_PROFILE_EXTENDED_HE_AAC = 1; }
  enum DtsProfile       { DTS_PROFILE_CORE = 0; DTS_PROFILE_HD_HRA = 1; DTS_PROFILE_HD_MA = 2; }
  enum AvsProfile       { AVS_PROFILE_AVS1_PART2 = 0; AVS_PROFILE_AVS2 = 1; AVS_PROFILE_AVS3 = 2; }

  message AacProfileEntry       { optional AacProfile       profile = 1; optional AudioProfileCapability capability = 2; }
  message DolbyAc3ProfileEntry  { optional DolbyAc3Profile  profile = 1; optional AudioProfileCapability capability = 2; }
  message DolbyEac3ProfileEntry { optional DolbyEac3Profile profile = 1; optional AudioProfileCapability capability = 2; }
  message MpegAudioProfileEntry { optional MpegAudioProfile profile = 1; optional AudioProfileCapability capability = 2; }
  message RealAudioProfileEntry { optional RealAudioProfile profile = 1; optional AudioProfileCapability capability = 2; }
  message UsacProfileEntry      { optional UsacProfile      profile = 1; optional AudioProfileCapability capability = 2; }
  message DtsProfileEntry       { optional DtsProfile       profile = 1; optional AudioProfileCapability capability = 2; }
  message AvsProfileEntry       { optional AvsProfile       profile = 1; optional AudioProfileCapability capability = 2; }

  message PcmCapability         { optional AudioProfileCapability base = 1; }
  message Mp3Capability         { optional AudioProfileCapability base = 1; }
  message AlacCapability        { optional AudioProfileCapability base = 1; }
  message SbcCapability         { optional AudioProfileCapability base = 1; }
  message DolbyAc4Capability    { optional AudioProfileCapability base = 1; }
  message DolbyTruehdCapability { optional AudioProfileCapability base = 1; }
  message FlacCapability        { optional AudioProfileCapability base = 1; }
  message VorbisCapability      { optional AudioProfileCapability base = 1; }
  message OpusCapability        { optional AudioProfileCapability base = 1; }
  message AacCapability         { repeated AacProfileEntry       profiles = 1; }
  message MpegAudioCapability   { repeated MpegAudioProfileEntry profiles = 1; }
  message DolbyAc3Capability    { repeated DolbyAc3ProfileEntry  profiles = 1; }
  message DolbyEac3Capability   { repeated DolbyEac3ProfileEntry profiles = 1; }
  message RealAudioCapability   { repeated RealAudioProfileEntry profiles = 1; }
  message UsacCapability        { repeated UsacProfileEntry      profiles = 1; }
  message DtsCapability         { repeated DtsProfileEntry       profiles = 1; }
  message AvsCapability         { repeated AvsProfileEntry       profiles = 1; }

  message AudioDecoderCapability {
    optional PcmCapability         pcm          = 1;
    optional AacCapability         aac          = 2;
    optional MpegAudioCapability   mpeg_audio   = 3;
    optional Mp3Capability         mp3          = 4;
    optional AlacCapability        alac         = 5;
    optional SbcCapability         sbc          = 6;
    optional DolbyAc3Capability    dolby_ac3    = 7;
    optional DolbyAc4Capability    dolby_ac4    = 8;
    optional DolbyEac3Capability   dolby_eac3   = 9;
    optional DolbyTruehdCapability dolby_truehd = 10;
    optional FlacCapability        flac         = 11;
    optional VorbisCapability      vorbis       = 12;
    optional OpusCapability        opus         = 13;
    optional RealAudioCapability   real_audio   = 15;
    optional UsacCapability        usac         = 16;
    optional DtsCapability         dts          = 17;
    optional AvsCapability         avs          = 18;
  }
  optional string interface_version = 1;
  optional string schema_version    = 2;
  repeated AudioDecoderCapability capabilities = 3;
}

/**
 * @brief Shared video decoder capabilities structure.
 *        Used by both servermanagermodule and media capabilities queries.
 */
message VideoCapabilities {
  enum DynamicRange     { DYNAMIC_RANGE_SDR = 0; DYNAMIC_RANGE_HLG = 1; DYNAMIC_RANGE_HDR10 = 2; DYNAMIC_RANGE_HDR10PLUS = 3; DYNAMIC_RANGE_DOLBY_VISION = 4; }
  enum Mpeg2ProfileType { MPEG2_PROFILE_MAIN = 0; MPEG2_PROFILE_SIMPLE = 1; }
  enum Mpeg2Level       { MPEG2_LEVEL_LOW = 0; MPEG2_LEVEL_MAIN = 1; MPEG2_LEVEL_HIGH = 2; }
  enum H264ProfileType  { H264_PROFILE_BASELINE = 0; H264_PROFILE_MAIN = 1; H264_PROFILE_HIGH = 2; }
  enum H264Level        { H264_LEVEL_3 = 0; H264_LEVEL_3_1 = 1; H264_LEVEL_4 = 2; H264_LEVEL_4_1 = 3; H264_LEVEL_5 = 4; H264_LEVEL_5_1 = 5; H264_LEVEL_5_2 = 6; }
  enum H265ProfileType  { H265_PROFILE_MAIN = 0; H265_PROFILE_MAIN_10 = 1; H265_PROFILE_MAIN_10_HDR10 = 2; }
  enum H265Level        { H265_LEVEL_4 = 0; H265_LEVEL_4_1 = 1; H265_LEVEL_5 = 2; H265_LEVEL_5_1 = 3; H265_LEVEL_5_2 = 4; H265_LEVEL_6 = 5; H265_LEVEL_6_1 = 6; H265_LEVEL_6_2 = 7; }
  enum Vp9ProfileType   { VP9_PROFILE_0 = 0; VP9_PROFILE_1 = 1; VP9_PROFILE_2 = 2; VP9_PROFILE_3 = 3; }
  enum Vp9Level         { VP9_LEVEL_1 = 0; VP9_LEVEL_1_1 = 1; VP9_LEVEL_2 = 2; VP9_LEVEL_2_1 = 3; VP9_LEVEL_3 = 4; VP9_LEVEL_3_1 = 5; VP9_LEVEL_4 = 6; VP9_LEVEL_4_1 = 7; VP9_LEVEL_5 = 8; VP9_LEVEL_5_1 = 9; VP9_LEVEL_5_2 = 10; VP9_LEVEL_6 = 11; VP9_LEVEL_6_1 = 12; VP9_LEVEL_6_2 = 13; }
  enum Av1ProfileType   { AV1_PROFILE_MAIN = 0; AV1_PROFILE_HIGH = 1; }
  enum Av1Level         { AV1_LEVEL_4_0 = 0; AV1_LEVEL_4_1 = 1; AV1_LEVEL_5_0 = 2; AV1_LEVEL_5_1 = 3; AV1_LEVEL_5_2 = 4; AV1_LEVEL_6_0 = 5; AV1_LEVEL_6_1 = 6; AV1_LEVEL_6_2 = 7; }

  message Mpeg2Profile { optional Mpeg2ProfileType type = 1; optional Mpeg2Level max_level = 2; optional uint64 max_bitrate_in_bps = 3; }
  message H264Profile  { optional H264ProfileType  type = 1; optional H264Level  max_level = 2; optional uint64 max_bitrate_in_bps = 3; }
  message H265Profile  { optional H265ProfileType  type = 1; optional H265Level  max_level = 2; optional uint64 max_bitrate_in_bps = 3; }
  message Vp9Profile   { optional Vp9ProfileType   type = 1; optional Vp9Level   max_level = 2; optional uint64 max_bitrate_in_bps = 3; }
  message Av1Profile   { optional Av1ProfileType   type = 1; optional Av1Level   max_level = 2; optional uint64 max_bitrate_in_bps = 3; }

  message Mpeg2CodecCapability { repeated Mpeg2Profile profiles = 1; repeated DynamicRange dynamic_ranges = 2; }
  message H264CodecCapability  { repeated H264Profile  profiles = 1; repeated DynamicRange dynamic_ranges = 2; }
  message H265CodecCapability  { repeated H265Profile  profiles = 1; repeated DynamicRange dynamic_ranges = 2; }
  message Vp9CodecCapability   { repeated Vp9Profile   profiles = 1; repeated DynamicRange dynamic_ranges = 2; }
  message Av1CodecCapability   { repeated Av1Profile   profiles = 1; repeated DynamicRange dynamic_ranges = 2; }

  message VideoCodecCapabilities {
    optional Mpeg2CodecCapability mpeg2 = 1;
    optional H264CodecCapability  h264  = 2;
    optional H265CodecCapability  h265  = 3;
    optional Vp9CodecCapability   vp9   = 4;
    optional Av1CodecCapability   av1   = 5;
  }
  message VideoDecoderCapability {
    optional VideoCodecCapabilities codec_capabilities = 1;
  }
  optional string interface_version = 1;
  optional string schema_version    = 2;
  repeated VideoDecoderCapability capabilities = 3;
}
