syntax = "proto2";

import "google/protobuf/descriptor.proto";
import "rialtoipc.proto";

package firebolt.rialto;

// You need this to generate the rpc service stubs
option cc_generic_services = true;

message TestEventSingleVar {
    required int32      var1 = 1;
}

message TestEventMultiVar {
    enum TestType {
        ENUM1 = 0;
        ENUM2 = 1;
    }
    required int32      var1 = 1;
    required uint32     var2 = 2;
    required TestType   var3 = 3;
    required string     var4 = 4;
}

message TestNoVar {
}
message TestSingleVar {
    required int32 var1 = 1;
}
message TestMultiVar {
    enum TestType {
        ENUM1 = 0;
        ENUM2 = 1;
    }
    required int32      var1 = 1;
    required uint32     var2 = 2;
    required TestType   var3 = 3;
    required string     var4 = 4;
}

message TestSingleVarNoReply {
    required int32 var1 = 1;
}

// -----------------------------------------------------------------------------
// File descriptor fields (field_is_fd) at different depths, for FdFieldWalker
// and FD transfer tests.

// Top-level FD fields only, with a non-FD field between them.
message TestFdTopLevel {
    optional int32 fd1 = 1 [(rialto.ipc.field_is_fd) = true];
    optional int32 value = 2;
    optional int32 fd2 = 3 [(rialto.ipc.field_is_fd) = true];
}

// A sub-message holding one FD field.
message TestFdHolder {
    optional int32 id = 1;
    optional int32 fd = 2 [(rialto.ipc.field_is_fd) = true];
}

// A repeated sub-message, each element carrying a nested FD.
message TestFdNestedRepeated {
    repeated TestFdHolder holders = 1;
}

// A repeated int32 FD field.
message TestFdRepeatedField {
    repeated int32 fds = 1 [(rialto.ipc.field_is_fd) = true];
}

// Top-level, nested, top-level. Field numbers deliberately differ from the
// declaration order: the walk follows declaration order.
message TestFdMixed {
    optional int32 first_fd = 3 [(rialto.ipc.field_is_fd) = true];
    repeated TestFdHolder holders = 1;
    optional int32 last_fd = 2 [(rialto.ipc.field_is_fd) = true];
}

// An optional sub-message that may be left unset.
message TestFdOptionalNested {
    optional TestFdHolder holder = 1;
    optional int32 fd = 2 [(rialto.ipc.field_is_fd) = true];
}

// Two levels of nesting.
message TestFdDeep {
    optional TestFdNestedRepeated inner = 1;
}

// A field marked field_is_fd that is not int32.
message TestFdNotInt32 {
    optional string fd = 1 [(rialto.ipc.field_is_fd) = true];
}

service TestModule {
    rpc TestRequestSingleVar(TestSingleVar) returns (TestNoVar) {
    }
    rpc TestRequestMultiVar(TestMultiVar) returns (TestNoVar) {
    }
    rpc TestResponseSingleVar(TestNoVar) returns (TestSingleVar) {
    }
    rpc TestResponseMultiVar(TestNoVar) returns (TestMultiVar) {
    }
    rpc TestRequestSingleVarNoReply(TestSingleVarNoReply) returns (TestNoVar) {
        option (rialto.ipc.no_reply) = true;
    }
}
